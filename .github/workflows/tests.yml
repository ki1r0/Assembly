name: Offline tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python launch.py --help
      - run: python -m pytest -q
      - run: python -m pip install -r pipeline/requirements-dev.txt xacro==2.1.1
      - run: python launch.py --help
        working-directory: pipeline
      - run: python -m pytest tests -q
        working-directory: pipeline
      - run: PYTHONPATH=benchmark python -m pytest benchmark/tests -q
      - run: PYTHONPATH=benchmark python -m assembly_bench.cli --help
